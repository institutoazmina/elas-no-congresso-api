services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: elas-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: elas
      POSTGRES_USER: elas
      POSTGRES_PASSWORD: elas
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "random_page_cost=1.1"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elas"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: elas-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.26
    container_name: elas-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    container_name: elas-api
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      POSTGRES_HOST: postgres
      POSTGRES_DB: elas
      POSTGRES_USER: elas
      POSTGRES_PASSWORD: elas
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Runtime é distroless (sem shell): não dá para usar `sh -c`.
    # O entrypoint em Python migra e sobe o uvicorn.
    command: ["python", "scripts/start_api.py"]

  worker:
    build: .
    container_name: elas-worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: elas
      POSTGRES_USER: elas
      POSTGRES_PASSWORD: elas
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: celery -A config worker -l info --concurrency=2 -Q celery

  ml-worker:
    build: .
    container_name: elas-ml-worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: elas
      POSTGRES_USER: elas
      POSTGRES_PASSWORD: elas
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info --concurrency=1 -Q ml

  beat:
    build: .
    container_name: elas-beat
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: elas
      POSTGRES_USER: elas
      POSTGRES_PASSWORD: elas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  ministack:
    image: nahuelnucera/ministack
    container_name: elas-ministack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      GATEWAY_PORT: 4566
      PERSIST_STATE: 1
      STATE_DIR: /data/ministack-state
    volumes:
      - ministackdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  ministackdata:
