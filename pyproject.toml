[project]
name = "elas-no-congresso-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "celery[redis]>=5.4",
    "django-anymail[amazon-ses]>=10",
    "django>=5.1,<5.2",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-ninja>=1.4",
    "django-redis>=5.4",
    "django-unfold>=0.76",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pypdf>=6.13.2",
    "python-decouple>=3.8",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.30",
    "whitenoise>=6.7",
    "pyarrow>=25.0.0",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "torch==2.12.0",
    "transformers==5.7.0",
    "django-cors-headers>=4.9.0",
    "email-validator>=2.3.0",
    "python-substack==0.9.1",
    "markdown-it-py>=3,<5",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.3",
    "factory-boy>=3.3.3",
    "locust>=2.43.4",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.11",
    "testcontainers>=4,<5",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
strict = false

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Locust (gevent) não roda sob pytest; use `make loadtest`.
norecursedirs = ["tests/load", ".*", "node_modules", "staticfiles"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
