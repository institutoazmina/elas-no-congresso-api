# Kamal 2 deploy — elas-no-congresso
# Colocation no EC2 AzMina-Mautic-et-all (x86_64) junto de mautic/metabase/elasnacamera.
# Padrão do host: SEM kamal-proxy (porta 80 é do nginx do host) — publica numa porta
# local e a borda é o Cloudflare Tunnel (igual metabase). Ver ec2-fit.md.
# Repo é open source: nenhum host/endpoint/credencial fica neste arquivo.
service: elas-no-congresso

# Imagem pública no GHCR (mesmo nome do repo). CI faz push; servidor faz pull.
image: wura-io/elas-no-congresso-api

# Host Ubuntu 24.04: login via ubuntu (no grupo docker). Chave via ssh-agent.
ssh:
  user: ubuntu

# ---- Servidores: host vem do ambiente (não exposto no repo) ----
servers:
  web:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>
    # SEM kamal-proxy: porta 80/443 do host são do nginx + cloudflared.
    proxy: false
    options:
      # Publica só no gateway docker0 (172.17.0.1) — alcançável pelo cloudflared
      # do host, NÃO exposto na internet. Túnel CF aponta p/ http://172.17.0.1:8010.
      publish:
        - "172.17.0.1:8010:8000"
      # Teto de RAM: box de 3.8 GB compartilhado — protege mautic/metabase de OOM.
      memory: 512m
  worker:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>
    cmd: celery -A config worker -l INFO --concurrency 1 -Q celery
    # Celery não serve HTTP; desliga o HEALTHCHECK HTTP herdado da imagem.
    options:
      no-healthcheck: true
      memory: 512m
  ml_worker:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>
    # Os dois BERTs da QuitérIA somam ~870 MB de pesos; esta fila não pode
    # dividir o limite de 512 MB do worker de ingestão/e-mail.
    cmd: celery -A config worker -l INFO --concurrency 1 -Q ml
    options:
      no-healthcheck: true
      memory: 1536m
  beat:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>
    cmd: celery -A config beat -l INFO -S django
    options:
      no-healthcheck: true
      memory: 256m

# ---- Registry GHCR. Credenciais vêm do ambiente. ----
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# ---- Build: host é x86_64 (não Graviton). Runner do CI já é x86 → sem QEMU. ----
builder:
  arch: amd64

# ---- Variáveis de ambiente ----
env:
  clear:
    # Não-sensível / não-identificável
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DEBUG: "False"
    # Site estático (domínio público, nada sensível): destino do redirect depois
    # de confirmar/cancelar alerta, e origem liberada no CORS do modal. Sem isto
    # o default de dev (localhost:4321) vazaria para produção.
    PUBLIC_SITE_URL: https://www.elasnocongresso.com.br
    CORS_ALLOWED_ORIGINS: https://www.elasnocongresso.com.br,https://elasnocongresso.com.br,https://homologacao.elasnocongresso.com.br
    # Redis = accessory isolado no mesmo host (NÃO reusar o redis_elasnacamera).
    REDIS_URL: redis://elas-no-congresso-redis:6379/0
    CELERY_BROKER_URL: redis://elas-no-congresso-redis:6379/0
    QUITERIA_ENABLED: "True"
    # SES usa a instance role do EC2; região e remetente não são segredos.
    AWS_DEFAULT_REGION: us-east-2
    AWS_SES_FROM_EMAIL: alertas@elasnocongresso.azmina.com.br
  secret:
    - SECRET_KEY
    # Banco (RDS) — endpoint/credenciais não expostos no repo
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_DB
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    # Rede / host
    - ALLOWED_HOSTS
    - SITE_BASE_URL

# ---- Redis accessory (no servidor), isolado por nome próprio ----
accessories:
  redis:
    image: redis:7-alpine
    host: <%= ENV["DEPLOY_HOST"] %>
    cmd: redis-server --appendonly yes
    volumes:
      - /var/lib/elas/redis:/data
