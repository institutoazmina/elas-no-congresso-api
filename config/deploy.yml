# Kamal 2 deploy — elas-no-congresso (EC2 Graviton / ARM64)
# Build no CI (x86) targetando linux/arm64; pull + run no servidor.
# Repo é open source: nenhum host/endpoint/credencial fica neste arquivo.
# Detalhes de infra vêm do ambiente (GH Secrets no CI / export local).
service: elas-no-congresso

# Imagem pública no GHCR (mesmo nome do repo). CI faz push; servidor faz pull.
image: wura-io/elas-no-congresso-api

# EC2 AL2023: login via ec2-user (root desabilitado). Chave via ssh-agent.
ssh:
  user: ec2-user

# ---- Servidores: host vem do ambiente (não exposto no repo) ----
servers:
  web:
    - <%= ENV["DEPLOY_HOST"] %>
  worker:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>
    cmd: celery -A config worker -l INFO --concurrency 2
  beat:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>
    cmd: celery -A config beat -l INFO -S django

# ---- kamal-proxy: HTTP por enquanto. Domínio + SSL depois. ----
proxy:
  ssl: false
  app_port: 8000
  healthcheck:
    path: /health/
    interval: 3

# ---- Registry GHCR. Credenciais vêm do ambiente. ----
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# ---- Build multi-arch: servidor é ARM64 ----
builder:
  arch: arm64

# ---- Variáveis de ambiente ----
env:
  clear:
    # Não-sensível / não-identificável
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DEBUG: "False"
    # Redis = accessory no mesmo host (hostname interno = nome do container)
    REDIS_URL: redis://elas-no-congresso-redis:6379/0
    CELERY_BROKER_URL: redis://elas-no-congresso-redis:6379/0
    # Desliga redirect HTTPS durante teste HTTP. Remover quando tiver SSL.
    SECURE_SSL_REDIRECT: "False"
  secret:
    - SECRET_KEY
    # Banco (RDS) — endpoint/credenciais não expostos no repo
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_DB
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    # Rede / host
    - ALLOWED_HOSTS
    - SITE_BASE_URL
    # AWS / SES
    - AWS_DEFAULT_REGION
    - AWS_SES_FROM_EMAIL
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY

# ---- Redis accessory (no servidor) ----
accessories:
  redis:
    image: redis:7-alpine
    host: <%= ENV["DEPLOY_HOST"] %>
    cmd: redis-server --appendonly yes
    volumes:
      - /var/lib/elas/redis:/data
