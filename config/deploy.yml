# Kamal 2 deploy — elas-no-congresso (EC2 Graviton / ARM64, us-east-2)
# Build no CI (x86) targetando linux/arm64; pull + run no EC2.
service: elas-no-congresso

# Imagem pública no GHCR. CI faz push; servidor faz pull.
image: wura-io/elas-no-congresso-api

# ---- Servidores (todos no mesmo EC2 t4g.micro por enquanto) ----
servers:
  web:
    - 3.145.11.201
  worker:
    hosts:
      - 3.145.11.201
    cmd: celery -A config worker -l INFO --concurrency 2
  beat:
    hosts:
      - 3.145.11.201
    cmd: celery -A config beat -l INFO -S django

# ---- kamal-proxy: HTTP no IP por enquanto. Domínio + SSL depois. ----
proxy:
  ssl: false
  app_port: 8000
  healthcheck:
    path: /health/
    interval: 3

# ---- Registry GHCR. Credenciais vêm do ambiente (CI / export local). ----
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# ---- Build multi-arch: EC2 é ARM64 ----
builder:
  arch: arm64

# ---- Variáveis de ambiente ----
env:
  clear:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DEBUG: "False"
    # IP libera teste; trocar/acrescentar domínio depois
    ALLOWED_HOSTS: "3.145.11.201,localhost,127.0.0.1"
    # RDS externo (não é container)
    POSTGRES_HOST: elas-no-congress-db.cn8kk8kmokrw.us-east-2.rds.amazonaws.com
    POSTGRES_PORT: "5432"
    POSTGRES_DB: elas
    POSTGRES_USER: elas_admin
    # Redis = accessory no mesmo host (hostname = nome do container)
    REDIS_URL: redis://elas-no-congresso-redis:6379/0
    CELERY_BROKER_URL: redis://elas-no-congresso-redis:6379/0
    # SES / AWS
    AWS_DEFAULT_REGION: us-east-2
    AWS_SES_FROM_EMAIL: alertas@elasnocongresso.com.br
    SITE_BASE_URL: http://3.145.11.201
    # Desliga redirect HTTPS durante teste HTTP. Ligar (remover) quando tiver SSL.
    SECURE_SSL_REDIRECT: "False"
  secret:
    - SECRET_KEY
    - POSTGRES_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY

# ---- Redis accessory (no EC2) ----
accessories:
  redis:
    image: redis:7-alpine
    host: 3.145.11.201
    cmd: redis-server --appendonly yes
    volumes:
      - /var/lib/elas/redis:/data
