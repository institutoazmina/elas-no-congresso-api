name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  tests:
    name: Lint, migrations and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgresql://elas:elas@localhost:5432/elas
      SECRET_KEY: ci-only-not-a-production-secret
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SES_FROM_EMAIL: alertas@elasnocongresso.local
      # The regular suite stays offline; the separate model job exercises inference.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      UV_LOCKED: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: elas
          POSTGRES_USER: elas
          POSTGRES_PASSWORD: elas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elas -d elas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.7.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: |
          uv python install
          uv sync --locked --dev

      - name: Set up Node for email templates
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/subscriptions/emails/package-lock.json

      - name: Install and build email templates
        working-directory: apps/subscriptions/emails
        run: |
          npm ci
          npm run build

      - name: Install Portuguese OCR for compatibility tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por

      - name: Lint
        run: uv run ruff check . --output-format github

      - name: Check Django configuration
        run: uv run python manage.py check

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      # pytest creates a fresh database and applies all migrations. The SES
      # integration fixtures start MiniStack using the runner's Docker daemon.
      # Test settings use eager Celery and in-memory caching, so no Redis is needed.
      - name: Run all unit, app and integration tests
        run: >-
          uv run pytest -m "not ml"
          --junitxml=test-results/pytest.xml
          --cov=apps --cov=config
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            test-results/pytest.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  ml-compatibility:
    name: Quiteria model compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      HF_HUB_DISABLE_XET: "1"
      UV_LOCKED: "1"
    steps:
      - name: Set model cache paths
        run: |
          echo "QUITERIA_TEST_MODEL_DIR=$RUNNER_TEMP/quiteria-model" >> "$GITHUB_ENV"
          echo "HF_HOME=$RUNNER_TEMP/huggingface" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.7.21"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install current locked dependencies
        run: |
          uv python install
          uv sync --locked --dev
      - name: Restore pinned model artifacts
        id: model-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.QUITERIA_TEST_MODEL_DIR }}
          key: quiteria-${{ hashFiles('tests/fixtures/compatibility/quiteria-baseline.json') }}
      - name: Download exact model revision
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          uv run python - <<'PY'
          import os
          import django
          from huggingface_hub import snapshot_download
          django.setup()
          from django.conf import settings
          snapshot_download(
              settings.QUITERIA_MODEL_ID,
              revision=settings.QUITERIA_MODEL_REVISION,
              local_dir=os.environ["QUITERIA_TEST_MODEL_DIR"],
              allow_patterns=["tema/*", "favorabilidade/*"],
          )
          PY
      - name: Verify offline CPU inference against pre-upgrade baseline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          uv run pytest tests/compatibility/test_quiteria_model.py --run-ml -m ml
          --junitxml=test-results/quiteria.xml
      - name: Upload real-model test report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quiteria-compatibility-report
          path: test-results/quiteria.xml
          if-no-files-found: ignore
          retention-days: 14

  passed:
    name: CI passed
    if: ${{ always() }}
    needs: [tests, security, ml-compatibility]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks to succeed
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          ML_RESULT: ${{ needs.ml-compatibility.result }}
        run: test "$TEST_RESULT" = success && test "$SECURITY_RESULT" = success && test "$ML_RESULT" = success
