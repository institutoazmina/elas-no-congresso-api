name: Deploy (Kamal)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GITHUB_TOKEN faz push no GHCR

# Não deixa dois deploys correrem ao mesmo tempo no mesmo host.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Host (não exposto no repo) + segredos do app — via GitHub Secrets
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
      # Registry: o próprio token do Actions tem write:packages pro repo
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby (Kamal)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v 2.12.0

      # Host é x86_64 e o runner também → build amd64 nativo, sem QEMU.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust EC2 host key
        # Sem -H: o net-ssh do Kamal não casa entradas hasheadas e dá HostKeyMismatch.
        # ssh-keygen -R limpa qualquer entrada stale antes de regravar a chave viva.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -R "$DEPLOY_HOST" 2>/dev/null || true
          ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # proxy:false publica web numa porta fixa (172.17.0.1:8010). Logo o web NOVO não
      # consegue bindar 8010 enquanto o ANTIGO segura a porta → "port already allocated".
      # Para o web atual antes do boot p/ liberar a porta (também limpa container órfão de
      # deploy anterior que falhou). Downtime de ~segundos, OK p/ API atrás do CF Tunnel.
      - name: Liberar porta do web (proxy:false usa porta fixa)
        run: kamal app stop --roles web || true

      # kamal setup = bootstrap (no-op: Docker já vem na AMI) + boot accessories + deploy.
      # `kamal deploy` puro NÃO sobe accessories → web não resolve o redis
      # (elas-no-congresso-redis) e a sessão/broker quebram. setup é idempotente:
      # cobre host novo e redeploys, e não recria accessory já rodando.
      # Build amd64 -> push GHCR -> pull + run no EC2 (web/worker/beat) + redis accessory.
      # Host compartilhado: deploy é proxy:false, publica web em 172.17.0.1:8010.
      # A borda (api.elasnocongresso.com.br) é o Cloudflare Tunnel — ver ops/colocation-setup.md.
      - name: Kamal setup (boot accessories + deploy)
        run: kamal setup

      # Migrations rodam no EC2 (único nó que alcança o RDS). --roles web evita 3x.
      # --reuse: roda no container web já vivo. Sem --reuse, o exec sobe um container
      # novo herdando publish 172.17.0.1:8010 e colide com o web → "port already allocated".
      - name: Migrate (on server)
        run: kamal app exec --reuse --roles web "python manage.py migrate --noinput"

      - name: Sync historical parliamentarian photos (on server)
        run: kamal app exec --reuse --roles web "python manage.py sync_legacy_parliamentarian_profiles"
