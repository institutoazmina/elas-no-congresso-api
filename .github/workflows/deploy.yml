name: Deploy (Kamal)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC -> assume AWS role
  contents: read
  packages: write   # GITHUB_TOKEN faz push no GHCR

# Não deixa dois deploys correrem ao mesmo tempo no mesmo host.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Host (não exposto no repo) + segredos do app — via GitHub Secrets
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_SES_FROM_EMAIL: ${{ secrets.AWS_SES_FROM_EMAIL }}
      # Registry: o próprio token do Actions tem write:packages pro repo
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby (Kamal)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v 2.12.0

      # Runner é x86; a imagem alvo é arm64 (EC2 Graviton) -> emulação via QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust EC2 host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # OIDC: assume a role da AWS (sem chave estática). A role precisa de
      # permissão p/ authorize/revoke-security-group-ingress no SG do EC2.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # O SG do EC2 só libera SSH pro IP do dev. Abre a porta 22 pro IP público
      # deste runner (efêmero) só durante o deploy; o cleanup revoga no fim.
      - name: Open SSH for this runner
        run: |
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com)"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region "$AWS_REGION" >/dev/null
          echo "SSH liberado para ${RUNNER_IP}/32"

      # kamal deploy: build arm64 -> push GHCR -> pull + run no EC2 (web/worker/beat).
      # AWS_* (SES) setados aqui no step p/ NÃO herdar as creds OIDC temporárias.
      - name: Kamal deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: kamal deploy

      # Migrations rodam no EC2 (único nó que alcança o RDS). --roles web evita 3x.
      - name: Migrate (on server)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: kamal app exec --roles web "python manage.py migrate --noinput"

      # Sempre revoga a regra temporária — mesmo se o deploy falhar.
      - name: Revoke SSH for this runner
        if: always() && env.RUNNER_IP != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region "$AWS_REGION" >/dev/null || true
          echo "SSH revogado para ${RUNNER_IP}/32"
