name: Backfill anotações (temporário)

# Dispara manualmente a carga retroativa das anotações. Enfileira o task Celery
# no worker (que roda ~2-3h async); o job aqui só enfileira e sai.
# JOB TEMPORÁRIO — remover este workflow após a carga.

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Apagar anotações antes (recomeço limpo)"
        type: boolean
        default: true
      start:
        description: "Retomar a partir da linha N (0 = do começo)"
        type: string
        default: "0"
      limit:
        description: "Limite de linhas (vazio = tudo; ex.: 5 para teste)"
        type: string
        default: ""

permissions:
  contents: read

# Evita dois disparos simultâneos (o segundo com reset apagaria o do primeiro).
concurrency:
  group: backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      # Mesmos secrets do deploy — o kamal renderiza toda a config (env.secret).
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_SES_FROM_EMAIL: ${{ secrets.AWS_SES_FROM_EMAIL }}
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby (Kamal)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v 2.12.0

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust EC2 host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -R "$DEPLOY_HOST" 2>/dev/null || true
          ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Enfileira via management command (args simples, sem aspas aninhadas).
      # --reuse roda no container web já vivo (não sobe container novo → sem
      # colisão na porta 8010, igual ao step de migrate do deploy).
      - name: Enfileirar backfill (worker roda async)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ARGS="--start ${{ inputs.start }}"
          if [ "${{ inputs.reset }}" != "true" ]; then ARGS="$ARGS --no-reset"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "Enfileirando: python manage.py backfill_annotations $ARGS"
          kamal app exec --reuse --roles web "python manage.py backfill_annotations $ARGS"
