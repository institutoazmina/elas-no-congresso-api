name: Create Substack draft

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First day, inclusive (YYYY-MM-DD, São Paulo)"
        type: string
        required: true
      end_date:
        description: "Last day, inclusive (YYYY-MM-DD, up to today)"
        type: string
        required: true
      refresh:
        description: "Recovery only: full official history refresh (slow)"
        type: boolean
        default: false
      allow_incomplete:
        description: "Allow a draft explicitly labeled with incomplete source coverage"
        type: boolean
        default: false
      dry_run:
        description: "Preview only, without database writes or a Substack draft"
        type: boolean
        default: false

permissions:
  contents: read

# Share the deploy lock: the running container must not be replaced mid-collection.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      REFRESH: ${{ inputs.refresh }}
      DRY_RUN: ${{ inputs.dry_run }}
      ALLOW_INCOMPLETE: ${{ inputs.allow_incomplete }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate dates
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          dates = []
          for key in ("START_DATE", "END_DATE"):
              value = os.environ[key]
              if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", value):
                  raise SystemExit(f"{key} must use YYYY-MM-DD")
              dates.append(date.fromisoformat(value))
          today = datetime.now(ZoneInfo("America/Sao_Paulo")).date()
          if not dates[0] <= dates[1] <= today:
              raise SystemExit("Require start_date <= end_date <= today (São Paulo)")
          PY

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v 2.12.0

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust deployment host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -R "$DEPLOY_HOST" 2>/dev/null || true
          ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify Substack session and publication access
        if: inputs.dry_run != true
        run: kamal app exec --reuse --roles web "python -u manage.py weekly_newsletter --check-auth"

      - name: Prepare radar and create unpublished draft
        run: |
          set -euo pipefail
          ARGS="--start-date $START_DATE --end-date $END_DATE"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            if [ "$REFRESH" = "true" ]; then ARGS="$ARGS --refresh"; fi
            if [ "$ALLOW_INCOMPLETE" = "true" ]; then ARGS="$ARGS --allow-incomplete"; fi
            ARGS="$ARGS --deliver"
          fi
          kamal app exec --reuse --roles web --verbose "python -u manage.py weekly_newsletter $ARGS" | tee newsletter-result.txt

      - name: Summarize result
        if: always()
        run: |
          {
            echo "Period: $START_DATE through $END_DATE (inclusive, São Paulo)."
            echo
            echo '```text'
            if [ -f newsletter-result.txt ]; then cat newsletter-result.txt; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
