name: Quiteria evaluation backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview coverage, queue missing evaluations, or retry failures"
        type: choice
        options: [preview, queue, status, retry]
        default: preview
      limit:
        description: "Maximum propositions to prepare; 0 includes all candidates"
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      BACKFILL_MODE: ${{ inputs.mode }}
      BACKFILL_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate input
        run: |
          set -euo pipefail
          case "$BACKFILL_MODE" in preview|queue|status|retry) ;; *) exit 1 ;; esac
          [[ "$BACKFILL_LIMIT" =~ ^[0-9]{1,9}$ ]] || exit 1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v 2.12.0

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust deployment host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -R "$DEPLOY_HOST" 2>/dev/null || true
          ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare or inspect durable classification requests
        run: |
          set -euo pipefail
          kamal app exec --reuse --roles web --verbose "python -u manage.py classification_backfill --mode $BACKFILL_MODE --limit $BACKFILL_LIMIT" | tee classification-result.txt

      - name: Summarize result
        if: always()
        run: |
          {
            echo "Mode: $BACKFILL_MODE; preparation limit: $BACKFILL_LIMIT."
            echo "Inference runs asynchronously on the ML worker; use status to check evaluation coverage."
            echo '```text'
            if [ -f classification-result.txt ]; then cat classification-result.txt; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
